<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Textiles · Sand Atelier — all shots filled</title>
  <style>
    :root { --bg:#120e0e; --cream:#f5f0e8; --gold:#c3a35e; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--cream);font-family:Palatino,Georgia,serif;padding:2rem 1rem 4rem}
    h1{text-align:center;font-weight:400;letter-spacing:.06em;margin-bottom:.5rem}
    p{text-align:center;color:var(--gold);font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;margin-bottom:2rem}
    .grid{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem}
    figure{border:1px solid rgba(195,163,94,.28);background:#0a0808}
    img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
    figcaption{padding:.65rem;font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
  </style>
</head>
<body>
  <h1>Textiles · Sand Atelier</h1>
  <p>All generated shots · filled into apparel leaves</p>
  <div class="grid" id="g"></div>
  <script>
    const shots = [
      ['mens.jpg','Mens'],
      ['suits.jpg','Suits'],
      ['suits-womens.jpg','Suits women'],
      ['denim.jpg','Denim'],
      ['ladies.jpg','Ladies'],
      ['blouse.jpg','Blouse'],
      ['sportswear.jpg','Sportswear'],
      ['sports-alt.jpg','Sports alt'],
      ['active.jpg','Active'],
      ['lingerie.jpg','Lingerie / lounge'],
      ['lingerie-flat.jpg','Lingerie flat'],
      ['robe-alt.jpg','Robe'],
      ['night-alt.jpg','Nightwear'],
      ['gown.jpg','Gown'],
      ['swim.jpg','Swim'],
      ['kids.jpg','Kids'],
      ['girls.jpg','Girls'],
      ['boys.jpg','Boys'],
      ['kids-sports.jpg','Kids sports'],
      ['home.jpg','Home textiles'],
      ['robe-model.jpg','Robe / lounge'],
      ['mens-underwear.jpg','Mens underwear'],
      ['socks.jpg','Socks'],
      ['hosiery.jpg','Hosiery'],
      ['shapewear.jpg','Shapewear'],
      ['sports-bra.jpg','Sports bra'],
      ['lingerie-set.jpg','Lingerie set'],
      ['panties.jpg','Panties'],
      ['bra.jpg','Bra'],
    ];
    const g = document.getElementById('g');
    for (const [file, label] of shots) {
      const f = document.createElement('figure');
      f.innerHTML = `<img src="./assets/harvictrade/products/fashion/textiles/${file}" alt="${label}" /><figcaption>${label}</figcaption>`;
      g.appendChild(f);
    }
  </script>
</body>
</html>
