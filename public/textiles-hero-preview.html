<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HARVICS Textile Hero Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #3D1212; font-family: Georgia, 'Times New Roman', serif; }
    .hero { position: relative; min-height: 100vh; overflow: hidden; }
    .poster, .reel {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    }
    .poster { z-index: 0; transition: opacity 0.7s; }
    .reel { z-index: 1; opacity: 0; transition: opacity 0.7s; filter: brightness(0.88) contrast(1.06); }
    .reel.playing { opacity: 1; }
    .poster.hidden { opacity: 0; }
    .grade {
      position: absolute; inset: 0; z-index: 2; pointer-events: none;
      background: linear-gradient(112deg, rgba(245,240,232,0.06) 0%, rgba(61,18,18,0.42) 38%, rgba(61,18,18,0.72) 100%);
    }
    .title {
      position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      opacity: 0; transition: opacity 0.9s; pointer-events: none;
    }
    .title.show { opacity: 1; }
    .title .brand { font-size: 11px; letter-spacing: 0.55em; text-transform: uppercase; color: rgba(245,240,232,0.9); margin-bottom: 8px; }
    .title .line { font-size: 14px; letter-spacing: 0.38em; text-transform: uppercase; color: rgba(195,163,94,0.95); }
    .copy {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 4;
      padding: 48px 24px 56px; max-width: 1200px; margin: 0 auto;
    }
    .copy h1 { color: #fff; font-size: clamp(2rem, 6vw, 4rem); letter-spacing: -0.03em; margin-bottom: 12px; }
    .copy p { color: rgba(255,255,255,0.7); max-width: 480px; line-height: 1.6; font-family: system-ui, sans-serif; font-size: 1rem; }
    .tag { color: #C3A35E; font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase; margin-bottom: 12px; font-family: system-ui, sans-serif; }
    .status {
      position: fixed; top: 12px; right: 12px; z-index: 99;
      background: rgba(0,0,0,0.55); color: #C3A35E; font: 11px/1.4 system-ui, sans-serif;
      padding: 8px 12px; letter-spacing: 0.08em; text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="status" id="status">Loading video…</div>
  <section class="hero">
    <img class="poster" id="poster" src="/assets/harvictrade/heroes/textiles/04-silk.webp" alt="" />
    <video
      id="reel"
      class="reel"
      src="/assets/harvictrade/heroes/textiles/hero-cinematic.mp4"
      poster="/assets/harvictrade/heroes/textiles/04-silk.webp"
      muted
      playsinline
      webkit-playsinline
      loop
      autoplay
      preload="auto"
    ></video>
    <div class="grade"></div>
    <div class="title" id="title">
      <div class="brand">Harvics</div>
      <div class="line">Textile &amp; Apparel</div>
    </div>
    <div class="copy">
      <div class="tag">Apparel, Fabrics &amp; Home Textiles</div>
      <h1>Textiles &amp; Apparels</h1>
      <p>Heritage craftsmanship and factory-direct apparel supply — premium woven fabrics to finished collections.</p>
    </div>
  </section>
  <script>
    const reel = document.getElementById('reel');
    const poster = document.getElementById('poster');
    const title = document.getElementById('title');
    const status = document.getElementById('status');

    function setStatus(msg) { status.textContent = msg; }

    function markPlaying() {
      reel.classList.add('playing');
      poster.classList.add('hidden');
      setStatus('Video playing ✓');
    }

    function play() {
      reel.muted = true;
      reel.play().then(markPlaying).catch(function () {
        setStatus('Autoplay blocked — tap to play');
      });
    }

    reel.addEventListener('playing', markPlaying);
    reel.addEventListener('loadeddata', play);
    reel.addEventListener('canplay', play);
    reel.addEventListener('timeupdate', function () {
      var t = reel.currentTime % 5;
      title.classList.toggle('show', t >= 4 && t < 4.95);
    });
    reel.addEventListener('error', function () {
      setStatus('Video not ready — generate with: npm run pvideo:textiles-hero');
    });

    document.body.addEventListener('click', play, { once: true });
    play();
  </script>
</body>
</html>
