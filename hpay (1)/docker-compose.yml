services:
  postgres:
    image: postgres:16-alpine
    container_name: hpay-postgres
    environment:
      POSTGRES_USER: hpay
      POSTGRES_PASSWORD: hpay
      POSTGRES_DB: hpay
    ports:
      - "5432:5432"
    volumes:
      - hpay_pg_data:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hpay -d hpay"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hpay_pg_data:
