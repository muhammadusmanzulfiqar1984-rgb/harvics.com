# Fly.io app for HarvyX Data Bank API + lean workers
# Deploy from repo root:
#   flyctl apps create harvyx-api --org personal   # once
#   flyctl secrets set -a harvyx-api --stage ...   # from .env.hx
#   flyctl deploy -a harvyx-api -c fly.hx-api.toml --dockerfile Dockerfile.hx-api

app = 'harvyx-api'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile.hx-api'

[env]
  NODE_ENV = 'production'
  HX_API_PORT = '3001'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
